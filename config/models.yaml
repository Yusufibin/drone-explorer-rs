# Routage des modèles LLM par type de tâche
# ============================================

models:
  # Navigation simple (goto, waypoints)
  # → Rapide et bon marché
  navigation:
    model: "deepseek/deepseek-chat"
    max_tokens: 512
    temperature: 0.2

  # Analyse terrain + image
  # → Vision + raisonnement
  vision:
    model: "anthropic/claude-sonnet-4"
    max_tokens: 1024
    temperature: 0.3

  # Décision critique (danger, batterie)
  # → Fiabilité maximale
  critical:
    model: "anthropic/claude-sonnet-4"
    max_tokens: 512
    temperature: 0.1

  # Planification de mission
  # → Complexité haut niveau
  planning:
    model: "anthropic/claude-opus-4"
    max_tokens: 2048
    temperature: 0.4
